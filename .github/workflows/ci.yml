name: Ganjumanji CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ganjumanji-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance
        run: npm run test:e2e
      - name: Upload browser playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ganjumanji-browser-playtest
          path: test-results/
          if-no-files-found: warn
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: ganjumanji-production-build
          path: dist/
          if-no-files-found: error
