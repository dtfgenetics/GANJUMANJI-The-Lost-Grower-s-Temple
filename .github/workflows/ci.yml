name: Ganjumanji CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ganjumanji-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run deterministic game and campaign tests
        run: npm test
      - name: Validate shipped mobile/UI contract
        run: npm run validate:ui
      - name: Build production bundle
        run: npm run build
      - name: Validate production release contract
        run: npm run validate:release
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: ganjumanji-production-build
          path: dist/
          if-no-files-found: error
